<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Franchise Analyst</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-shell">
        <button class="mobile-menu-button" id="mobileMenuButton" aria-label="Open sidebar">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M2.5 5h15M2.5 10h15M2.5 15h15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>

        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <span class="brand-mark">NBA</span>
                    <span class="brand-name">Franchise Analyst</span>
                </div>
                <button class="icon-button" id="collapseButton" aria-label="Collapse sidebar" title="Collapse sidebar">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10.5 3L5.5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </div>

            <button class="new-chat-button" id="newChatButton">
                <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                <span>New chat</span>
            </button>

            <div class="sidebar-search">
                <input type="text" id="sidebarSearch" placeholder="Search chats..." autocomplete="off">
            </div>

            <nav class="sidebar-scroll" id="sidebarThreadList" aria-label="Conversation history"></nav>

            <div class="sidebar-footer">
                <div class="sidebar-footer-item muted">Built with care</div>
            </div>
        </aside>

        <main class="main">
            <div class="main-content" id="mainContent"></div>
            <div class="composer-dock" id="composerDock"></div>
        </main>
    </div>

    <script src="./state.js"></script>
    <script src="./api.js"></script>
    <script src="./render/charts.js"></script>
    <script src="./render/emptyState.js"></script>
    <script src="./render/sidebar.js"></script>
    <script src="./render/composer.js"></script>
    <script src="./render/teamDashboard.js"></script>
    <script src="./render/chatThread.js"></script>
    <script src="./app.js"></script>
</body>
</html>
